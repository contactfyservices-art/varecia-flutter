name: varecia_app
description: Application mobile de l'Association Varecia
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Backend
  firebase_core: ^2.24.0
  cloud_firestore: ^4.13.0

  # State management
  provider: ^6.1.1

  # Persistance de session locale
  shared_preferences: ^2.2.2

  # UI
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0

  # Fonctionnalités
  image_picker: ^1.0.4
  file_picker: ^8.1.2
  audioplayers: ^5.2.1
  jitsi_meet_flutter_sdk: ^10.2.0
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/sounds/
